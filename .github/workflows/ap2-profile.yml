name: AP2 model profile
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install rdflib==7.6.0
      - run: python tools/check_ap2_profile.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
